<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Como funciona a Loteria Super Sena</title>
  <desc id="desc">Cada jogo custa seis reais. Prêmios: Unidade seis reais, Dezena vinte reais, Centena duzentos reais, Milhar dois mil reais, Quina vinte mil reais e Sena duzentos mil reais. Sorteios a cada trinta minutos.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a78e8"/><stop offset=".55" stop-color="#dff6ff"/><stop offset="1" stop-color="#0878e8"/></linearGradient>
    <linearGradient id="navy" x2="0" y2="1"><stop stop-color="#164bd0"/><stop offset="1" stop-color="#061d73"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff86a"/><stop offset=".55" stop-color="#ffdf00"/><stop offset="1" stop-color="#f5a900"/></linearGradient>
    <linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff5a4d"/><stop offset="1" stop-color="#c40000"/></linearGradient>
    <linearGradient id="white" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f4ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="1000" fill="url(#bg)"/>
  <g opacity=".14" stroke="#fff" stroke-width="16"><path d="M0 160L1200 0M0 360L1200 200M0 560L1200 400M0 760L1200 600M0 960L1200 800"/></g>
  <rect x="32" y="24" width="1136" height="178" rx="48" fill="url(#navy)" stroke="#ffdf00" stroke-width="12" filter="url(#shadow)"/>
  <text x="600" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="55" font-weight="900" fill="#fff">COMO FUNCIONA A</text>
  <text x="600" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="62" font-weight="900" fill="#ffeb00">LOTERIA SUPER SENA?</text>
  <text x="600" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="35" font-weight="800" fill="#071d65">Escolha 6 números para jogar.</text>
  <rect x="74" y="285" width="1052" height="126" rx="42" fill="url(#red)" stroke="#fff" stroke-width="7" filter="url(#shadow)"/>
  <rect x="74" y="285" width="1052" height="126" rx="42" fill="none" stroke="#ffdf00" stroke-width="5"/>
  <text x="600" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="#fff">VALOR FIXO DA APOSTA: <tspan fill="#ffeb00" font-size="58">R$ 6,00</tspan></text>
  <rect x="34" y="445" width="1132" height="420" rx="38" fill="url(#white)" stroke="#ffdf00" stroke-width="10" filter="url(#shadow)"/>
  <path d="M48 484Q48 455 78 455H1122Q1152 455 1152 484V535H48Z" fill="url(#navy)"/>
  <text x="600" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="900" fill="#fff">PRÊMIOS DA SUPER SENA</text>
  <g font-family="Arial,sans-serif" font-weight="900" text-anchor="middle">
    <g transform="translate(66 562)"><rect width="330" height="126" rx="24" fill="#fff" stroke="#1681d9" stroke-width="5"/><path d="M4 28Q4 4 28 4H302Q326 4 326 28V48H4Z" fill="url(#gold)"/><text x="165" y="38" font-size="30" fill="#071d65">UNIDADE</text><text x="165" y="101" font-size="43" fill="#c50000">R$ 6,00</text></g>
    <g transform="translate(435 562)"><rect width="330" height="126" rx="24" fill="#fff" stroke="#1681d9" stroke-width="5"/><path d="M4 28Q4 4 28 4H302Q326 4 326 28V48H4Z" fill="url(#gold)"/><text x="165" y="38" font-size="30" fill="#071d65">DEZENA</text><text x="165" y="101" font-size="43" fill="#c50000">R$ 20,00</text></g>
    <g transform="translate(804 562)"><rect width="330" height="126" rx="24" fill="#fff" stroke="#1681d9" stroke-width="5"/><path d="M4 28Q4 4 28 4H302Q326 4 326 28V48H4Z" fill="url(#gold)"/><text x="165" y="38" font-size="30" fill="#071d65">CENTENA</text><text x="165" y="101" font-size="43" fill="#c50000">R$ 200,00</text></g>
    <g transform="translate(66 715)"><rect width="330" height="126" rx="24" fill="#fff" stroke="#1681d9" stroke-width="5"/><path d="M4 28Q4 4 28 4H302Q326 4 326 28V48H4Z" fill="url(#gold)"/><text x="165" y="38" font-size="30" fill="#071d65">MILHAR</text><text x="165" y="101" font-size="43" fill="#c50000">R$ 2.000,00</text></g>
    <g transform="translate(435 715)"><rect width="330" height="126" rx="24" fill="#fff" stroke="#1681d9" stroke-width="5"/><path d="M4 28Q4 4 28 4H302Q326 4 326 28V48H4Z" fill="url(#gold)"/><text x="165" y="38" font-size="30" fill="#071d65">QUINA</text><text x="165" y="101" font-size="39" fill="#c50000">R$ 20.000,00</text></g>
    <g transform="translate(804 715)"><rect width="330" height="126" rx="24" fill="#fff" stroke="#1681d9" stroke-width="5"/><path d="M4 28Q4 4 28 4H302Q326 4 326 28V48H4Z" fill="url(#gold)"/><text x="165" y="38" font-size="30" fill="#071d65">SENA</text><text x="165" y="101" font-size="39" fill="#c50000">R$ 200.000,00</text></g>
  </g>
  <rect x="74" y="892" width="1052" height="84" rx="34" fill="url(#navy)" stroke="#ffdf00" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="165" cy="934" r="27" fill="none" stroke="#fff" stroke-width="7"/><path d="M165 914V934L181 944" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="645" y="950" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="900" fill="#fff">SORTEIOS A CADA <tspan fill="#ffeb00">30 MINUTOS</tspan></text>
</svg>