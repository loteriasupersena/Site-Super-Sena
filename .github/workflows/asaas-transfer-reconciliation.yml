name: Reconcile Asaas Pix transfers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asaas-transfer-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Reconcile pending Pix transfers
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          RECONCILIATION_TOKEN: ${{ secrets.ASAAS_RECONCILIATION_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SITE_BASE_URL" ] || [ -z "$RECONCILIATION_TOKEN" ]; then
            echo "Missing SITE_BASE_URL or ASAAS_RECONCILIATION_TOKEN repository secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            -X POST "${SITE_BASE_URL%/}/api/internal/asaas/transfers/reconcile" \
            -H "Authorization: Bearer $RECONCILIATION_TOKEN" \
            -H "Content-Type: application/json"
