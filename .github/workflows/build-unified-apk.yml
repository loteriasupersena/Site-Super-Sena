name: Build Unified Super Sena APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/cambista-apk-isolation-receipt-layout
      - fix/thermal-receipt-match-screen
      - fix/android-thermal-receipt-blank-print
      - cleanup/android-thermal-image-only
    paths:
      - "android-app/**"
      - ".github/workflows/build-unified-apk.yml"

permissions:
  contents: read

concurrency:
  group: unified-super-sena-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ./android-app
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cambista-Super-Sena-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
